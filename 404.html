<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Página no encontrada · Lunia Beauty</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Página autocontenida a propósito: sin fuentes externas ni CSS/JS externo.
    Si algo en el sitio no cargó (por eso llegaste a un 404), esta página
    no debe depender de esos mismos recursos para poder mostrarse bien.
  -->
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: linear-gradient(150deg, #7C529C 0%, #A680C9 55%, #D9C2E8 100%);
      color: #fff;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap { max-width: 420px; }
    .kicker {
      color: #F1C3CA;
      font-weight: 600;
      font-size: 0.95rem;
      margin: 0 0 1rem;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: 4.5rem;
      line-height: 1;
      margin: 0;
    }
    .msg {
      font-size: 1.1rem;
      margin: 1.25rem 0 0.25rem;
    }
    .sub {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.78);
      margin: 0 0 2rem;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      padding: 0.75em 1.4em;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      background: #fff;
      color: #7C529C;
    }
    .btn--ghost {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.75);
      color: #fff;
    }
    @media (max-width: 360px) {
      h1 { font-size: 3.5rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="kicker">Lunia Beauty</p>
    <h1>404</h1>
    <p class="msg">Esta página se relajó de más y se perdió.</p>
    <p class="sub">El enlace puede estar roto o la página ya no existe.</p>
    <div class="actions">
      <a class="btn" href="/index.html">Volver al inicio</a>
      <!-- TODO: mantener este número sincronizado con CONFIG.numeroWhatsApp en js/main.js -->
      <a class="btn btn--ghost" href="https://wa.me/5356395148?text=Hola%2C%20quisiera%20reservar%20un%20masaje.">Reservar por WhatsApp</a>
    </div>
  </div>
</body>
</html>
<!-- IE necesita 512+ bytes: https://docs.microsoft.com/archive/blogs/ieinternals/friendly-http-error-pages -->
